; Системные лимиты памяти PHP
memory_limit = 2G
upload_max_filesize = 100M
post_max_size = 100M

; ------------------------------------------------------------------
; Xdebug: по умолчанию ВЫКЛЮЧЕН.
; Загруженный Xdebug в режиме develop замедляет каждый запрос в 2-5 раз.
; Включать точечно через переменную окружения, она перекрывает ini:
;   XDEBUG_MODE=debug   php artisan ...      (отладка)
;   XDEBUG_MODE=coverage php artisan test    (покрытие, уже в composer scripts)
; Для FPM: добавить XDEBUG_MODE=debug в .env и перезапустить контейнер app.
; ------------------------------------------------------------------
xdebug.mode = off
xdebug.max_nesting_level = 512

; ------------------------------------------------------------------
; OPcache: без него PHP перекомпилирует тысячи файлов Filament/Laravel
; на каждый запрос.
; validate_timestamps=1 + revalidate_freq=0 — изменения кода видны сразу (dev).
; На проде: opcache.validate_timestamps=0 и перезапуск FPM при деплое.
; ------------------------------------------------------------------
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 40000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
opcache.save_comments = 1

; Кэш realpath: критично для bind-mount томов Docker (меньше stat() на файлы)
realpath_cache_size = 4096K
realpath_cache_ttl = 600
