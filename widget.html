<!-- Контейнер виджета -->
<div class="amigrupp-dark-calc-wrapper"
     style="width: 100%; max-width: 1440px; margin: 0 auto; padding: 20px 16px; box-sizing: border-box; background-color: #151f2b;">
    <div style="width: 100%; min-height: 750px; position: relative; background-color: #151f2b; border: 1px solid rgba(255, 255, 255, 0.08); box-sizing: border-box;">
        <div id="calcAppRoot"></div>
    </div>
</div>

<style>

    /* Токены темы */
    #calcAppRoot,
    div[role="dialog"] {
        --calc-radius: 0px !important;
        --calc-background: 213 34% 13% !important;
        --calc-foreground: 0 0% 100% !important;
        --calc-card: 213 11% 33% !important;
        --calc-card-foreground: 0 0% 100% !important;
        --calc-border: 213 11% 45% !important;
        --calc-primary: 184 67% 35% !important;
        --calc-primary-foreground: 0 0% 100% !important;
        --calc-ring: 184 67% 35% !important;
    }

    /* Прелоадер виджета */
    #vms-widget-preloader,
    #vms-widget-preloader * {
        background-color: #151f2b !important;
        color: #ffffff !important;
    }

    /* Корневой блок */
    #calcAppRoot {
        background-color: #151f2b !important;
        color: #ffffff !important;
    }

    /* Блоки карточек */
    #calcAppRoot [class*="card"],
    #calcAppRoot [class*="Card"],
    #calcAppRoot [class*="Block_wrapper"] {
        background-color: #4b535d !important;
        border: 1px solid rgba(255, 255, 255, 0.1) !important;
        border-radius: 0px !important;
    }

    /* Карточки выбора формы */
    #calcAppRoot [class*="FormBlock"] [class*="card"],
    #calcAppRoot [class*="FormBlock"] [class*="Card"] {
        background-color: #151f2b !important;
        border: 1px solid rgba(255, 255, 255, 0.15) !important;
    }

    /* Выбранная форма */
    #calcAppRoot [class*="cardSelected"] {
        outline: 3px solid rgb(29, 142, 149) !important;
        outline-offset: -3px !important;
        border-color: transparent !important;
    }

    /* 3D область */
    #calcAppRoot [class*="Model_wrapper"] {
        background-color: #151f2b !important;
        border: 1px solid rgba(255, 255, 255, 0.1) !important;
    }

    /* Светлый текст заголовков */
    #calcAppRoot h1, #calcAppRoot h2, #calcAppRoot h3,
    #calcAppRoot [class*="title"], #calcAppRoot [class*="Title"],
    #calcAppRoot [class*="value"],
    #calcAppRoot label, #calcAppRoot p,
    #calcAppRoot [class*="Subtitle"] {
        color: #ffffff !important;
    }

    /* Второстепенные подписи */
    #calcAppRoot [class*="description"],
    #calcAppRoot [class*="Description"],
    #calcAppRoot [class*="itemName"],
    #calcAppRoot [class*="subtitle"] {
        color: #cbd5e1 !important;
    }

    /* Инпуты, селекты, каталоги стекла/ручек/петель */
    #calcAppRoot input,
    #calcAppRoot select,
    #calcAppRoot [role="combobox"],
    #calcAppRoot [class*="Select_trigger"],
    #calcAppRoot div:has(> [class*="iconBox"]),
    #calcAppRoot div:has(> [class*="triggerIconBox"]) {
        background-color: #ffffff !important;
        color: #16191b !important;
        border: 1px solid #d1d5db !important;
        border-radius: 0px !important;
        box-sizing: border-box !important;
    }

    /* Темный текст внутри полей */
    #calcAppRoot input,
    #calcAppRoot select,
    #calcAppRoot [role="combobox"] *,
    #calcAppRoot [class*="Select_trigger"] *,
    #calcAppRoot div:has(> [class*="iconBox"]) [class*="name"],
    #calcAppRoot div:has(> [class*="iconBox"]) * {
        color: #16191b !important;
    }

    /* Фокус полей */
    #calcAppRoot input:focus,
    #calcAppRoot select:focus,
    #calcAppRoot [role="combobox"]:focus,
    #calcAppRoot [class*="Select_trigger"]:focus,
    #calcAppRoot div:has(> [class*="iconBox"]):hover {
        border-color: rgb(29, 142, 149) !important;
        box-shadow: 0 0 0 1px rgb(29, 142, 149) !important;
    }

    /* Иконка карандаша и стрелки */
    #calcAppRoot [class*="triggerIconBox"],
    #calcAppRoot [class*="iconBox"] {
        background-color: #f1f5f9 !important;
        border-left: 1px solid #d1d5db !important;
    }

    #calcAppRoot [class*="triggerIconBox"] svg,
    #calcAppRoot [class*="iconBox"] svg {
        color: #475569 !important;
        stroke: #475569 !important;
    }

    /* Выпадающие списки селектов */
    div[data-radix-popper-content-wrapper] > div,
    div[role="listbox"] {
        background-color: #ffffff !important;
        border: 1px solid #cbd5e1 !important;
        border-radius: 0px !important;
    }

    /* Текст для всех пунктов */
    div[role="listbox"] *,
    div[role="option"],
    div[role="option"] *,
    div[data-radix-popper-content-wrapper] span {
        color: #16191b !important;
    }

    /* Ховер пунктов селекта */
    div[role="option"]:hover,
    div[role="option"][data-highlighted] {
        background-color: #f1f5f9 !important;
    }

    div[role="option"]:hover *,
    div[role="option"][data-highlighted] * {
        color: #16191b !important;
    }

    /* Кнопка Оставить заявку */
    #calcAppRoot button[class*="submitBtn"],
    #calcAppRoot button[class*="variantDefault"]:not([style*="background-color"]):not([class*="ColorItem"]):not([class*="colorItem"]),
    div[role="dialog"] button[class*="confirmBtn"],
    div[role="dialog"] button[type="submit"]:not([style*="background-color"]) {
        background-color: rgb(29, 142, 149) !important;
        color: #ffffff !important;
        border: 1px solid rgb(29, 142, 149) !important;
        border-radius: 0px !important;
        transition: background-color 0.25s ease, border-color 0.25s ease !important;
    }

    #calcAppRoot button[class*="submitBtn"]:hover,
    #calcAppRoot button[class*="variantDefault"]:not([style*="background-color"]):not([class*="ColorItem"]):not([class*="colorItem"]):hover,
    div[role="dialog"] button[class*="confirmBtn"]:hover,
    div[role="dialog"] button[type="submit"]:not([style*="background-color"]):hover {
        background-color: rgb(202, 31, 66) !important;
        border-color: rgb(202, 31, 66) !important;
        color: #ffffff !important;
    }

    /* Нижние кнопки */
    #calcAppRoot [class*="mainRow"] button,
    #calcAppRoot [class*="resetRow"] button,
    #calcAppRoot button[class*="variantOutline"],
    div[role="dialog"] button[class*="closeBtn"] {
        background-color: #151f2b !important;
        border: 1px solid rgba(255, 255, 255, 0.2) !important;
        color: #ffffff !important;
        border-radius: 0px !important;
        transition: all 0.25s ease !important;
    }

    /* Красный ховер нижних кнопок */
    #calcAppRoot [class*="mainRow"] button:hover,
    #calcAppRoot [class*="resetRow"] button:hover,
    #calcAppRoot button[class*="variantOutline"]:hover,
    div[role="dialog"] button[class*="closeBtn"]:hover {
        background-color: rgb(202, 31, 66) !important;
        border-color: rgb(202, 31, 66) !important;
        color: #ffffff !important;
    }

    #calcAppRoot [class*="mainRow"] button:hover *,
    #calcAppRoot [class*="resetRow"] button:hover *,
    #calcAppRoot button[class*="variantOutline"]:hover * {
        color: #ffffff !important;
        stroke: #ffffff !important;
    }

    /* Радиокнопки круги */
    #calcAppRoot [role="radio"] {
        width: 18px !important;
        height: 18px !important;
        min-width: 18px !important;
        min-height: 18px !important;
        border-radius: 50% !important;
        background-color: #ffffff !important;
        border: 1.5px solid #94a3b8 !important;
        padding: 0 !important;
        display: inline-flex !important;
        align-items: center !important;
        justify-content: center !important;
        box-sizing: border-box !important;
    }

    #calcAppRoot [role="radio"][data-state="checked"] {
        border-color: rgb(29, 142, 149) !important;
    }

    #calcAppRoot [role="radio"] [class*="circle"],
    #calcAppRoot [role="radio"] [data-state="checked"] div,
    #calcAppRoot [role="radio"] div div {
        width: 8px !important;
        height: 8px !important;
        min-width: 8px !important;
        min-height: 8px !important;
        border-radius: 50% !important;
        background-color: rgb(29, 142, 149) !important;
    }

    /* Свитчеры капсулы */
    #calcAppRoot button[role="switch"] {
        border-radius: 9999px !important;
        background-color: #242f3d !important;
        border: 1px solid rgba(255, 255, 255, 0.2) !important;
    }

    #calcAppRoot button[role="switch"][data-state="checked"] {
        background-color: rgb(29, 142, 149) !important;
        border-color: rgb(29, 142, 149) !important;
    }

    #calcAppRoot button[role="switch"] span {
        border-radius: 9999px !important;
        background-color: #ffffff !important;
    }

    /* Образцы цветов фурнитуры */
    #calcAppRoot button[style*="background-color"],
    #calcAppRoot [class*="ColorItem_item"],
    #calcAppRoot [class*="colorItem"] {
        border-radius: 0px !important;
        border: none !important;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.2) !important;
    }

    #calcAppRoot [class*="itemSelected"],
    #calcAppRoot button[class*="ColorItem"][class*="Selected"] {
        outline: 2px solid rgb(29, 142, 149) !important;
        outline-offset: 2px !important;
    }

    /* Чертеж схемы размеров */
    #calcAppRoot [class*="Preview_wrapper"],
    #calcAppRoot div:has(> svg[viewBox="0 0 104 104"]),
    #calcAppRoot [id="calcMeasuresPreview"] {
        background-color: #ffffff !important;
        border: 1px solid #d1d5db !important;
        border-radius: 0px !important;
    }

    #calcAppRoot #dim-lines,
    #calcAppRoot .dim-lines,
    #calcAppRoot .dim-line {
        stroke: #485561 !important;
    }

    #calcAppRoot .dim-text,
    #calcAppRoot [id^="dim-text-"] {
        fill: #16191b !important;
        font-weight: 600 !important;
    }

    /* Модальные окна */
    div[role="dialog"] {
        background-color: #151f2b !important;
        color: #ffffff !important;
        border: 1px solid rgba(255, 255, 255, 0.15) !important;
        border-radius: 0px !important;
    }

    div[role="dialog"] [class*="card"],
    div[role="dialog"] [class*="Card"] {
        background-color: #4b535d !important;
        border: 1px solid rgba(255, 255, 255, 0.15) !important;
        color: #ffffff !important;
        border-radius: 0px !important;
    }

    div[role="dialog"] input:not([type="checkbox"]):not([type="radio"]) {
        border: 1px solid #d1d5db !important;
        background-color: #ffffff !important;
        color: #16191b !important;
        padding: 6px 12px !important;
        height: 38px !important;
        outline: none !important;
        box-sizing: border-box !important;
        border-radius: 0px !important;
    }

    div[role="dialog"] input:not([type="checkbox"]):not([type="radio"]):focus {
        border-color: rgb(29, 142, 149) !important;
        box-shadow: 0 0 0 1px rgb(29, 142, 149) !important;
    }

    /* Таблица сметы */
    #calcAppRoot table {
        color: #ffffff !important;
    }

    #calcAppRoot th {
        color: #cbd5e1 !important;
        border-color: rgba(255, 255, 255, 0.15) !important;
    }

    #calcAppRoot td {
        color: #ffffff !important;
        border-color: rgba(255, 255, 255, 0.1) !important;
    }

    #calcAppRoot tr:hover {
        background-color: rgba(255, 255, 255, 0.04) !important;
    }
</style>

<!-- Скрипт виджета -->
<script
        src="https://amigrupp.vistegra-admin.ru/widget/embed.js"
        data-target="calcAppRoot"
        data-type="user"
        data-lang="ru"
        data-policy-link="/privacy"
        data-oferta-link="/oferta"
        data-phone-placeholder="+7 (343) xxx-xx-xx"
        data-phone-prefix="+7 (343) "
        async
></script>
